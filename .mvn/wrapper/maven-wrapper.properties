# Maven Wrapper Properties
# This file tells the Maven Wrapper which version of Maven to download
# and use when someone runs ./mvnw or .\mvnw.cmd
#
# wrapperVersion   : version of the maven-wrapper tool itself
# distributionType : "only-script" means no wrapper JAR is needed —
#                    the shell scripts (mvnw / mvnw.cmd) handle everything
# distributionUrl  : where to download Apache Maven 3.9.8 from Maven Central
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.8/apache-maven-3.9.8-bin.zip
